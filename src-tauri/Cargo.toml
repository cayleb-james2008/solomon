[package]
name = "solomon"
version = "0.1.0"
edition = "2021"
description = "Solomon — RSI control plane"
default-run = "solomon"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
which = "6"
wait-timeout = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"

# Windows job objects — bind spawned improver children to the GUI process so closing the app
# (normal exit, crash, or kill) terminates the whole backend tree (see control::proc::init_app_job).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1
# NB: panic=unwind (the default) is intentional — the watchdog sweep uses catch_unwind to isolate
# a panicking repo so it cannot abort crash-recovery for the others (matches monitor.py per-repo try/except).
