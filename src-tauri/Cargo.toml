[package]
name = "solomon"
version = "0.1.0"
edition = "2021"
description = "Solomon — RSI control plane"
default-run = "solomon"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
which = "6"
wait-timeout = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
# ops plane (Phase 1): read-only SQLite probes over the managed products' state DBs (asmodeus.db).
# bundled so no system sqlite3 is required; opened SQLITE_OPEN_READ_ONLY only — never a write path.
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
# test fixtures only: set file mtimes for the file_age probe's golden vectors
filetime = "0.2"

# Windows job objects — bind spawned improver children to the GUI process so closing the app
# (normal exit, crash, or kill) terminates the whole backend tree (see control::proc::init_app_job).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
strip = true
# Build-speed streamlining (operator ask 2026-07-02): full LTO + codegen-units=1 made every
# release link take ~10 min under lane load. Thin LTO + a few codegen units cuts link time
# several-fold for a few percent of binary size — Solomon redeploys often (self-redeploy +
# fix-sessions), so build time IS an operational cost here.
lto = "thin"
opt-level = "s"
codegen-units = 4
# NB: panic=unwind (the default) is intentional — the watchdog sweep uses catch_unwind to isolate
# a panicking repo so it cannot abort crash-recovery for the others (matches monitor.py per-repo try/except).

[profile.dev]
# Build-speed + disk streamlining: keep line tables so panic/backtrace file:line stays readable
# (the improver reads gate stderr to decide fixes), but drop full variable/type debuginfo — the
# per-binary .pdb dominated target/debug (~0.88GB). `test` inherits [profile.dev], so `cargo test`
# (the gate) gets the smaller/faster build too. Only debuginfo emission changes — debug_assertions
# / overflow-checks are untouched, so no runtime behavior change and the windows_subsystem cfg-gate
# is unaffected.
debug = "line-tables-only"
