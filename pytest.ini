[pytest]
# Solomon's own suite lives ONLY in tests/. Without this, pytest collects from the cwd and a
# managed-repo clone placed under Solomon (e.g. repos/<name>/ when an operator relocates a repo's
# path into Solomon) would be collected too — its tests need that repo's deps, not Solomon's, so
# the whole gate errors out. Scope collection to tests/ so stray clones can't break Solomon's gate.
testpaths = tests
