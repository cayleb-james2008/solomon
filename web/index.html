<!DOCTYPE html>
<html lang="en" data-theme="dusk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solomon — Operator Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to main content</a>
  <!-- blueprint grid backdrop -->
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" width="22" height="22" class="brand-crown" aria-hidden="true"><path d="M5 18 L19 18 L19 9 L15.5 12.5 L12 7 L8.5 12.5 L5 9 Z" fill="currentColor"/><rect x="5" y="15.2" width="14" height="1.6" rx="0.6" fill="var(--bg-1)" opacity="0.35"/><circle cx="5" cy="9" r="1.1" fill="var(--bg-1)"/><circle cx="12" cy="7" r="1.1" fill="var(--bg-1)"/><circle cx="19" cy="9" r="1.1" fill="var(--bg-1)"/></svg></span>
      <span class="brand-name">Solomon</span>
      <span class="brand-sub">autopilot</span>
    </div>
    <div class="topbar-actions">
      <button id="addPanel" class="btn ghost" title="Add a panel to your workspace">
        <svg viewBox="0 0 24 24" class="ic"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M17.5 14v7M14 17.5h7"/></svg>
        <span>Add panel</span>
      </button>
      <button id="openSettings" class="btn ghost icon-only" title="Settings">
        <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
      </button>
      <span id="version" class="version" title="Solomon build"></span>
    </div>
  </header>

  <main id="workspace" class="workspace">
    <div class="boot"><div class="spinner"></div><span>Loading Solomon…</span></div>
  </main>

  <!-- add-panel popover -->
  <div id="bento" class="bento hidden"></div>

  <!-- settings slide-over -->
  <div id="settingsScrim" class="scrim hidden"></div>
  <aside id="settings" class="drawer hidden"></aside>

  <div id="toasts" class="toasts"></div>

  <script src="app.js"></script>
</body>
</html>
