<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solomon</title>
  <link rel="icon" href="assets/icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">&#8734;</span>
        <span class="brand-name">Solomon</span>
      </div>
      <div class="topbar-actions">
        <div class="ap-toggle">
          <span>Auto-push</span>
          <button class="switch" id="autoPush" title="Global auto-push gate" aria-label="Auto-push"><span class="knob"></span></button>
        </div>
        <div class="theme-row" id="themeRow"></div>
        <button class="icon-btn" id="refreshBtn" title="Refresh">
          <svg viewBox="0 0 256 256"><path fill="currentColor" d="M224 128a96 96 0 0 1-163.9 67.9L33.9 168H72a8 8 0 0 0 0-16H16a8 8 0 0 0-8 8v56a8 8 0 0 0 16 0v-36.7l27.1 27.1A112 112 0 1 0 16 128a8 8 0 0 0 16 0 96 96 0 0 1 192 0Z"/></svg>
        </button>
      </div>
    </header>

    <div class="shell" id="shell">
      <nav class="rail" id="rail"></nav>
      <main class="main" id="view">
        <div class="loading"><div class="spinner"></div>Loading Solomon…</div>
      </main>
      <aside class="dock" id="dock"></aside>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
